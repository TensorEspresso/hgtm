<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>HS2 Hierarchy Explorer</title>
<style>
  :root{
    --bg:#0d1117; --card:#161b22; --fg:#e6edf3; --muted:#8b949e; --border:#30363d; --accent:#38bdf8;
    --owns:#39d353; --manages:#58a6ff; --partners:#f85149;
  }
  *{box-sizing:border-box}
  html,body{height:100%}
  body{margin:0;background:var(--bg);color:var(--fg);font:14px/1.45 system-ui,-apple-system,'Segoe UI',sans-serif;display:flex;flex-direction:column}

  header{display:flex;flex-wrap:wrap;align-items:center;gap:10px 18px;padding:10px 20px;
    background:rgba(13,17,23,.96);border-bottom:1px solid var(--border);position:sticky;top:0;z-index:40;backdrop-filter:blur(6px)}
  header h1{margin:0;font-size:15px}
  .sub{font-size:12px;color:var(--muted);max-width:420px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  select,input[type=search]{background:var(--card);border:1px solid var(--border);color:var(--fg);border-radius:6px;padding:6px 10px;font-size:13px;outline:none}
  select:focus,input:focus{border-color:var(--accent)}
  #search{width:210px}
  input[type=search]::-webkit-search-cancel-button{display:none}
  .search-wrap{position:relative;display:flex;align-items:center}
  .search-clear{position:absolute;right:8px;background:none;border:0;color:var(--muted);cursor:pointer;font-size:13px;padding:0 2px}
  #matchInfo{font-size:12px;color:var(--muted);min-width:76px}
  #matchInfo.hit{color:var(--accent)}
  #matchInfo.miss{color:var(--partners)}
  #stats{font-size:12px;color:var(--muted)}
  .legend{display:flex;gap:14px;margin-left:auto;align-items:center;font-size:12px;color:var(--muted)}
  .legend .item{display:flex;align-items:center;gap:6px}
  .swatch{width:22px;height:0;border-top:2.5px solid}
  .swatch.owns{border-color:var(--owns)}
  .swatch.manages{border-color:var(--manages);border-top-style:dashed}
  .swatch.partners_with{border-color:var(--partners);border-top-style:dotted}

  #viewport{flex:1;position:relative;overflow:hidden}
  #treeSvg{width:100%;height:100%;display:block;cursor:grab;touch-action:none}
  #treeSvg.panning{cursor:grabbing}
  .zoombar{position:absolute;right:16px;top:16px;display:flex;flex-direction:column;gap:6px;z-index:10}
  .zoombar button{width:32px;height:32px;background:var(--card);border:1px solid var(--border);color:var(--fg);border-radius:6px;font-size:15px;cursor:pointer}
  .zoombar button:hover{border-color:var(--accent)}
  .node rect{transition:filter .12s}
  .node:hover rect{filter:brightness(1.35)}
  .edge-hit{cursor:pointer}
  text{user-select:none}

  #panel{position:fixed;top:0;right:0;height:100vh;width:400px;max-width:92vw;background:var(--card);
    border-left:1px solid var(--border);transform:translateX(102%);transition:transform .22s ease;z-index:50;overflow-y:auto;padding:20px 22px}
  #panel.open{transform:none}
  #panel .close{position:absolute;top:10px;right:12px;background:none;border:0;color:var(--muted);font-size:18px;cursor:pointer}
  #panel .close:hover{color:var(--fg)}
  .badge{display:inline-block;padding:2px 10px;border-radius:999px;font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.05em}
  .badge.b-health_system{background:#38bdf8;color:#0c4a6e}
  .badge.b-hospital{background:#4ade80;color:#052e16}
  .badge.b-specialty_center{background:#c084fc;color:#2e1065}
  .badge.b-clinic{background:#86efac;color:#052e16}
  .badge.b-air_ambulance{background:#fb923c;color:#431407}
  .badge.b-physician_group{background:#60a5fa;color:#1e3a5f}
  .badge.b-clinic_network{background:#60a5fa;color:#1e3a5f}
  .badge.b-program{background:#2dd4bf;color:#042f2e}
  .badge.b-brand{background:#8b949e;color:#1f2328}
  .badge.b-other{background:#30363d;color:var(--fg)}
  h2.title{margin:10px 0 4px;font-size:20px;line-height:1.25}
  .meta{font-size:12px;color:var(--muted);margin:2px 0}
  .note{font-size:13px;color:#c9d1d9;background:rgba(56,139,248,.08);border-left:2px solid var(--accent);padding:8px 12px;border-radius:0 6px 6px 0;margin:12px 0}
  section h3{font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);margin:18px 0 8px}
  .rel{border:1px solid var(--border);border-radius:8px;padding:10px 12px;margin-bottom:10px;background:rgba(255,255,255,.02)}
  .rel .top{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
  .chip{padding:1px 8px;border-radius:999px;font-size:10.5px;font-weight:700}
  .chip.owns{background:rgba(57,211,83,.15);color:var(--owns)}
  .chip.manages{background:rgba(88,166,255,.15);color:var(--manages)}
  .chip.partners_with{background:rgba(248,81,73,.15);color:var(--partners)}
  .conf{font-size:10.5px;font-weight:700;padding:1px 8px;border-radius:999px}
  .conf.high{background:rgba(57,211,83,.15);color:var(--owns)}
  .conf.medium{background:rgba(210,153,34,.15);color:#d29922}
  .conf.low{background:rgba(240,136,62,.15);color:#f0883e}
  .conf.inferred{background:rgba(139,153,158,.15);color:var(--muted)}
  .rel .other{font-size:13.5px;font-weight:600}
  .rel .other a{color:var(--fg);text-decoration:none;cursor:pointer;border-bottom:1px dotted var(--muted)}
  .srcs{margin-top:6px;display:flex;flex-wrap:wrap;gap:5px}
  .src{font-size:10.5px;font-family:ui-monospace,Menlo,monospace;background:var(--bg);border:1px solid var(--border);padding:1px 7px;border-radius:5px;color:var(--muted)}
  .vline{font-size:11px;color:var(--muted);margin-top:5px}
  .rnote{font-size:12px;color:#c9d1d9;margin-top:6px;font-style:italic}
  .kv{display:grid;grid-template-columns:110px 1fr;gap:3px 10px;font-size:12.5px;margin-top:8px}
  .kv .k{color:var(--muted)}
  .kv .v{font-family:ui-monospace,Menlo,monospace;font-size:11.5px;word-break:break-all}
  .addr{font-size:13px;color:#c9d1d9;margin:3px 0}
  .addr .lbl{color:var(--muted);font-size:11px;text-transform:uppercase;letter-spacing:.05em}
  .empty{color:var(--muted);font-size:13px;font-style:italic}
</style>
</head>
<body>
<header>
  <div style="min-width:0">
    <h1 id="sysTitle">HS2 Hierarchy Explorer</h1>
    <div class="sub" id="sysSub">loading…</div>
  </div>
  <select id="sysSelect" title="Health system"></select>
  <div class="search-wrap">
    <input id="search" type="search" placeholder="Search entities…" autocomplete="off">
    <button class="search-clear" id="searchClear" title="Clear search" style="display:none">✕</button>
  </div>
  <span id="matchInfo"></span>
  <div id="stats"></div>
  <div class="legend" id="legend"></div>
</header>

<div id="viewport">
  <svg id="treeSvg"></svg>
  <div class="zoombar">
    <button id="zoomIn" title="Zoom in">＋</button>
    <button id="zoomOut" title="Zoom out">−</button>
    <button id="zoomFit" title="Fit to view">⌂</button>
  </div>
</div>

<div id="panel">
  <button class="close" id="panelClose" title="Close">✕</button>
  <div id="panelBody"></div>
</div>

<script>
'use strict';
// ─── Constants ────────────────────────────────────────────────
const NS = 'http://www.w3.org/2000/svg';
const NW = 190, NH = 54, HGAP = 38, VGAP = 76;
const EDGE = {
  owns:          { raw: '#39d353', dash: null,  label: 'owns' },
  manages:       { raw: '#58a6ff', dash: '7 4', label: 'manages' },
  partners_with: { raw: '#f85149', dash: '2 5', label: 'partners_with' },
};
const TIER_FILL   = ['#1c2541', '#1a2332', '#1c3a5e', '#1a4a5e'];
const TIER_STROKE = ['#38bdf8', '#4ade80', '#c084fc', '#2dd4bf'];
const TYPE_LABEL = {
  health_system: 'Health System', hospital: 'Hospital', specialty_center: 'Specialty Center',
  clinic: 'Clinic', air_ambulance: 'Air Ambulance', physician_group: 'Physician Group',
  clinic_network: 'Clinic Network', program: 'Program', brand: 'Brand',
};

// ─── State ────────────────────────────────────────────────────
let data = null, ent = {}, children = {}, relMap = {};
let expanded = new Set(), matches = new Set(), query = '';
let vb = null, world = null, parentOf = {};

const svg = document.getElementById('treeSvg');
const panel = document.getElementById('panel');
const panelBody = document.getElementById('panelBody');

// ─── Load ─────────────────────────────────────────────────────
async function loadSystem(id) {
  const res = await fetch('/api/hierarchy?system=' + encodeURIComponent(id));
  if (!res.ok) throw new Error('Failed to load ' + id + ': HTTP ' + res.status);
  data = await res.json();

  ent = {}; data.entities.forEach(e => ent[e.id] = e);
  children = {}; relMap = {}; parentOf = {};
  data.relationships.forEach(r => {
    (children[r.source] = children[r.source] || []).push(r.target);
    relMap[r.source + '->' + r.target] = r;
    parentOf[r.target] = r.source;
  });
  expanded = new Set(Object.keys(children)); // default: fully expanded
  matches = new Set(); query = '';
  document.getElementById('search').value = '';
  document.getElementById('searchClear').style.display = 'none';
  const mi = document.getElementById('matchInfo'); mi.textContent = ''; mi.className = '';

  document.getElementById('sysTitle').textContent = data.health_system || id;
  document.title = (data.health_system || id) + ' — HS2 Explorer';
  document.getElementById('sysSub').textContent =
    'extracted ' + (data.extracted_at || '—') + (data.source ? ' · ' + data.source : '');

  updateStats();
  render();
  fit();
}

// ─── Stats + legend (dynamic counts from data) ────────────────
function updateStats() {
  document.getElementById('stats').textContent =
    data.entities.length + ' entities · ' + data.relationships.length + ' relationships';
  const counts = { owns: 0, manages: 0, partners_with: 0 };
  data.relationships.forEach(r => { if (counts[r.relationship_type] !== undefined) counts[r.relationship_type]++; });
  document.getElementById('legend').innerHTML = Object.entries(EDGE)
    .map(([k, v]) => '<span class="item"><span class="swatch ' + k + '"></span>' + v.label + ' (' + counts[k] + ')</span>')
    .join('');
}

// ─── Layout ───────────────────────────────────────────────────
function leafCount(id) {
  const kids = children[id];
  if (kids && kids.length && expanded.has(id)) return kids.reduce((s, c) => s + leafCount(c), 0);
  return 1;
}
function layoutNode(id, x, y) {
  const n = { id, x, y };
  const kids = children[id];
  if (kids && kids.length && expanded.has(id)) {
    const total = kids.reduce((s, c) => s + leafCount(c), 0);
    const w = total * (NW + HGAP) - HGAP;
    let cx = x + NW / 2 - w / 2;
    n.kids = kids.map(c => { const k = layoutNode(c, cx, y + NH + VGAP); cx += leafCount(c) * (NW + HGAP); return k; });
  }
  return n;
}
function collect(n, out) { out.nodes.push(n); (n.kids || []).forEach(k => collect(k, out)); }

// ─── Render ───────────────────────────────────────────────────
function render() {
  const root = data.entities.find(e => e.tier === 0);
  if (!root) return;
  const out = { nodes: [] };
  collect(layoutNode(root.id, 0, 0), out);

  let minX = 1e9, maxX = -1e9, minY = 1e9, maxY = -1e9;
  out.nodes.forEach(n => {
    minX = Math.min(minX, n.x - NW / 2); maxX = Math.max(maxX, n.x + NW / 2);
    minY = Math.min(minY, n.y - NH / 2); maxY = Math.max(maxY, n.y + NH / 2 + 24);
  });
  const pad = 48;
  world = { x: minX - pad, y: minY - pad, w: (maxX - minX) + pad * 2, h: (maxY - minY) + pad * 2 };
  if (!vb) vb = { ...world };
  applyVB();
  svg.innerHTML = '';

  // Edges (drawn first, behind nodes)
  const gE = document.createElementNS(NS, 'g');
  out.nodes.forEach(n => {
    (n.kids || []).forEach(k => {
      const r = relMap[n.id + '->' + k.id];
      if (!r) return;
      const x1 = n.x, y1 = n.y + NH / 2, x2 = k.x, y2 = k.y - NH / 2, my = (y1 + y2) / 2;
      const d = 'M ' + x1 + ' ' + y1 + ' C ' + x1 + ' ' + my + ', ' + x2 + ' ' + my + ', ' + x2 + ' ' + y2;
      const spec = EDGE[r.relationship_type] || { raw: '#8b949e', dash: null };
      const p = document.createElementNS(NS, 'path');
      p.setAttribute('d', d); p.setAttribute('fill', 'none');
      p.setAttribute('stroke', spec.raw); p.setAttribute('stroke-width', '2');
      if (spec.dash) p.setAttribute('stroke-dasharray', spec.dash);
      p.setAttribute('opacity', '.75'); p.setAttribute('pointer-events', 'none');
      gE.appendChild(p);
      const hit = document.createElementNS(NS, 'path');
      hit.setAttribute('d', d); hit.setAttribute('fill', 'none');
      hit.setAttribute('stroke', 'transparent'); hit.setAttribute('stroke-width', '14');
      hit.setAttribute('pointer-events', 'stroke'); hit.setAttribute('class', 'edge-hit');
      const tip = document.createElementNS(NS, 'title');
      tip.textContent = r.relationship_type + ' (' + r.confidence + ') — ' + ent[r.source].name + ' → ' + ent[r.target].name;
      hit.appendChild(tip);
      hit.addEventListener('click', ev => { ev.stopPropagation(); showRel(r); });
      hit.addEventListener('mousedown', ev => ev.stopPropagation());
      gE.appendChild(hit);
    });
  });
  svg.appendChild(gE);

  const gN = document.createElementNS(NS, 'g');
  out.nodes.forEach(n => gN.appendChild(renderNode(n)));
  svg.appendChild(gN);
}

function renderNode(n) {
  const e = ent[n.id];
  const tier = Math.min(e.tier ?? 0, 3);
  const isMatch = matches.has(n.id);
  const g = document.createElementNS(NS, 'g');
  g.setAttribute('class', 'node'); g.style.cursor = 'pointer';

  const rect = document.createElementNS(NS, 'rect');
  rect.setAttribute('x', n.x - NW / 2); rect.setAttribute('y', n.y - NH / 2);
  rect.setAttribute('width', NW); rect.setAttribute('height', NH);
  rect.setAttribute('rx', 8);
  rect.setAttribute('fill', TIER_FILL[tier]);
  rect.setAttribute('stroke', isMatch ? '#38bdf8' : TIER_STROKE[tier]);
  rect.setAttribute('stroke-width', isMatch ? 3 : 1.5);

  const name = e.name.length > 26 ? e.name.slice(0, 25) + '…' : e.name;
  const t = document.createElementNS(NS, 'text');
  t.setAttribute('x', n.x); t.setAttribute('y', n.y - 6);
  t.setAttribute('text-anchor', 'middle'); t.setAttribute('fill', '#fff');
  t.setAttribute('font-size', '12.5'); t.setAttribute('font-weight', '600');
  t.textContent = name;

  const sub = document.createElementNS(NS, 'text');
  sub.setAttribute('x', n.x); sub.setAttribute('y', n.y + 12);
  sub.setAttribute('text-anchor', 'middle'); sub.setAttribute('fill', '#8b949e');
  sub.setAttribute('font-size', '10');
  sub.textContent = (TYPE_LABEL[e.type] || e.type) + ' · tier ' + e.tier;

  g.appendChild(rect); g.appendChild(t); g.appendChild(sub);

  const kids = children[n.id];
  if (kids && kids.length) {
    const open = expanded.has(n.id);
    const c = document.createElementNS(NS, 'circle');
    c.setAttribute('cx', n.x); c.setAttribute('cy', n.y + NH / 2 + 13);
    c.setAttribute('r', 9); c.setAttribute('fill', '#21262d'); c.setAttribute('stroke', '#30363d');
    const bt = document.createElementNS(NS, 'text');
    bt.setAttribute('x', n.x); bt.setAttribute('y', n.y + NH / 2 + 17);
    bt.setAttribute('text-anchor', 'middle'); bt.setAttribute('fill', '#fff');
    bt.setAttribute('font-size', '11'); bt.setAttribute('font-weight', '700');
    bt.textContent = open ? '−' : '+';
    g.appendChild(c); g.appendChild(bt);
    const hit = document.createElementNS(NS, 'circle');
    hit.setAttribute('cx', n.x); hit.setAttribute('cy', n.y + NH / 2 + 13);
    hit.setAttribute('r', 13); hit.setAttribute('fill', 'transparent');
    hit.addEventListener('click', ev => { ev.stopPropagation(); toggleNode(n.id); });
    hit.addEventListener('mousedown', ev => ev.stopPropagation());
    g.appendChild(hit);
  }

  g.addEventListener('click', ev => { ev.stopPropagation(); showEnt(n.id); });
  g.addEventListener('mousedown', ev => ev.stopPropagation());
  return g;
}

function toggleNode(id) {
  if (expanded.has(id)) expanded.delete(id); else expanded.add(id);
  render();
}

// ─── ViewBox: zoom / pan / fit ────────────────────────────────
function applyVB() { if (vb) svg.setAttribute('viewBox', vb.x + ' ' + vb.y + ' ' + vb.w + ' ' + vb.h); }
function fit() { if (world) { vb = { ...world }; applyVB(); } }
function zoomBy(f, cx, cy) {
  if (!vb) return;
  vb = { x: cx - (cx - vb.x) * f, y: cy - (cy - vb.y) * f, w: vb.w * f, h: vb.h * f };
  applyVB();
}
document.getElementById('zoomIn').onclick = () => zoomBy(0.8, vb ? vb.x + vb.w / 2 : 0, vb ? vb.y + vb.h / 2 : 0);
document.getElementById('zoomOut').onclick = () => zoomBy(1.25, vb ? vb.x + vb.w / 2 : 0, vb ? vb.y + vb.h / 2 : 0);
document.getElementById('zoomFit').onclick = fit;

svg.addEventListener('wheel', e => {
  e.preventDefault();
  const m = svg.getScreenCTM();
  if (!m) return;
  const pt = svg.createSVGPoint(); pt.x = e.clientX; pt.y = e.clientY;
  const p = pt.matrixTransform(m.inverse());
  zoomBy(e.deltaY > 0 ? 1.12 : 1 / 1.12, p.x, p.y);
}, { passive: false });

let pan = null;
svg.addEventListener('mousedown', e => {
  const m = svg.getScreenCTM();
  if (!m) return;
  pan = { sx: e.clientX, sy: e.clientY, vx: vb.x, vy: vb.y, k: m.a, moved: false };
  svg.classList.add('panning');
});
window.addEventListener('mousemove', e => {
  if (!pan) return;
  if (Math.abs(e.clientX - pan.sx) + Math.abs(e.clientY - pan.sy) > 3) pan.moved = true;
  vb.x = pan.vx - (e.clientX - pan.sx) / pan.k;
  vb.y = pan.vy - (e.clientY - pan.sy) / pan.k;
  applyVB();
});
window.addEventListener('mouseup', e => {
  if (pan && !pan.moved && e.target === svg) closePanel();
  pan = null;
  svg.classList.remove('panning');
});

// ─── Search ───────────────────────────────────────────────────
const searchEl = document.getElementById('search');
const matchInfo = document.getElementById('matchInfo');
const searchClear = document.getElementById('searchClear');
searchEl.addEventListener('input', () => {
  query = searchEl.value.trim().toLowerCase();
  searchClear.style.display = query ? '' : 'none';
  if (!query) {
    matches = new Set(); matchInfo.textContent = ''; matchInfo.className = '';
    render(); return;
  }
  matches = new Set(data.entities.filter(e => e.name.toLowerCase().includes(query)).map(e => e.id));
  matches.forEach(id => {           // auto-expand ancestors of matches
    let p = parentOf[id];
    while (p) { expanded.add(p); p = parentOf[p]; }
  });
  render();
  if (matches.size) {
    matchInfo.textContent = matches.size + ' match' + (matches.size > 1 ? 'es' : '');
    matchInfo.className = 'hit';
    fit();
  } else {
    matchInfo.textContent = 'no matches';
    matchInfo.className = 'miss';
  }
});
searchClear.onclick = () => { searchEl.value = ''; searchEl.dispatchEvent(new Event('input')); searchEl.focus(); };

// ─── Detail panel ─────────────────────────────────────────────
function esc(s) { return String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c])); }
function fmtAddr(a) {
  if (!a) return '';
  return [a.street, a.city, [a.state, a.zip].filter(Boolean).join(' ')].filter(Boolean).join(', ');
}
function typeBadge(t) { return '<span class="badge b-' + t + '">' + esc(TYPE_LABEL[t] || t) + '</span>'; }
function confBadge(c) { return '<span class="conf ' + c + '">' + esc(c) + '</span>'; }
function srcChips(sources) { return '<div class="srcs">' + (sources || []).map(s => '<span class="src">' + esc(s) + '</span>').join('') + '</div>'; }

function relRow(r, selfId) {
  const out = r.source === selfId;
  const other = out ? r.target : r.source;
  return '<div class="rel">' +
    '<div class="top"><span class="chip ' + r.relationship_type + '">' + esc(r.relationship_type) + '</span>' +
    '<span class="other">' + (out ? '→ ' : '← ') + '<a data-ent="' + esc(other) + '">' + esc(ent[other].name) + '</a></span>' +
    confBadge(r.confidence) + '</div>' +
    srcChips(r.sources) +
    '<div class="vline">verified ' + esc(r.verified_at || '—') + '</div>' +
    (r.note ? '<div class="rnote">' + esc(r.note) + '</div>' : '') +
    '</div>';
}

function showEnt(id) {
  const e = ent[id];
  const rels = data.relationships.filter(r => r.source === id || r.target === id);
  let h = '<div>' + typeBadge(e.type) + ' <span class="meta" style="margin-left:8px">tier ' + e.tier + '</span></div>';
  h += '<h2 class="title">' + esc(e.name) + '</h2>';
  if (e.address) h += '<div class="addr">📍 ' + esc(fmtAddr(e.address)) + '</div>';
  (e.addresses || []).forEach(a => {
    h += '<div class="addr"><span class="lbl">' + esc(a.label || 'site') + ' · </span>' + esc(fmtAddr(a)) + '</div>';
  });
  if (e.service_area) h += '<div class="addr"><span class="lbl">service area · </span>' + esc(e.service_area) + '</div>';
  if (e.note) h += '<div class="note">' + esc(e.note) + '</div>';
  if (e.brand_id || e.epic_id || e.fhir_endpoint) {
    h += '<div class="kv">';
    if (e.brand_id) h += '<div class="k">brand_id</div><div class="v">' + esc(e.brand_id) + '</div>';
    if (e.epic_id) h += '<div class="k">epic_id</div><div class="v">' + esc(e.epic_id) + '</div>';
    if (e.fhir_endpoint) h += '<div class="k">fhir</div><div class="v">' + esc(e.fhir_endpoint) + '</div>';
    h += '</div>';
  }
  h += '<section><h3>Relationships (' + rels.length + ')</h3>';
  if (!rels.length) h += '<div class="empty">No relationships.</div>';
  rels.forEach(r => { h += relRow(r, id); });
  h += '</section>';
  panelBody.innerHTML = h;
  bindLinks();
  openPanel();
}

function showRel(r) {
  panelBody.innerHTML =
    '<div style="display:flex;gap:8px;align-items:center"><span class="chip ' + r.relationship_type + '">' + esc(r.relationship_type) + '</span>' + confBadge(r.confidence) + '</div>' +
    '<h2 class="title" style="font-size:17px"><a data-ent="' + esc(r.source) + '" style="cursor:pointer">' + esc(ent[r.source].name) + '</a><br>' +
    '<span style="color:var(--muted);font-size:13px">— ' + esc(r.relationship_type) + ' →</span><br>' +
    '<a data-ent="' + esc(r.target) + '" style="cursor:pointer">' + esc(ent[r.target].name) + '</a></h2>' +
    srcChips(r.sources) +
    '<div class="vline">verified ' + esc(r.verified_at || '—') + '</div>' +
    (r.note ? '<div class="note">' + esc(r.note) + '</div>' : '');
  bindLinks();
  openPanel();
}

function bindLinks() {
  panelBody.querySelectorAll('[data-ent]').forEach(a => {
    a.addEventListener('click', () => { const id = a.getAttribute('data-ent'); if (ent[id]) showEnt(id); });
  });
}
function openPanel() { panel.classList.add('open'); }
function closePanel() { panel.classList.remove('open'); }
document.getElementById('panelClose').onclick = closePanel;
document.addEventListener('keydown', e => { if (e.key === 'Escape') closePanel(); });

// ─── Init ─────────────────────────────────────────────────────
(async function init() {
  try {
    const res = await fetch('/api/systems');
    const systems = await res.json();
    const sel = document.getElementById('sysSelect');
    systems.forEach(s => {
      const o = document.createElement('option');
      o.value = s.id; o.textContent = s.name;
      sel.appendChild(o);
    });
    sel.value = systems.some(s => s.id === 'uw-medicine') ? 'uw-medicine' : (systems[0] && systems[0].id);
    sel.onchange = () => loadSystem(sel.value);
    await loadSystem(sel.value);
  } catch (err) {
    document.getElementById('sysSub').textContent = 'Failed to load: ' + err.message;
  }
})();
</script>
</body>
</html>
